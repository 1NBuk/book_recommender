groups:
  - name: book-recommender
    rules:
      - alert: BookRecApiDown
        expr: up{job="book-recommender"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Book recommender API is down ({{ $labels.instance }})"

      - alert: BookRecHighErrorRate
        expr: |
          sum(rate(bookrec_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(bookrec_http_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "5xx error rate above 5% for 5 minutes"

      - alert: BookRecHighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(bookrec_http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "p95 latency above 500 ms for 10 minutes"

      - alert: BookRecFallbackShareHigh
        # Only part of the users have precomputed recommendations, so some fallback is normal.
        # Tune the threshold to your baseline; a sudden jump usually means broken/stale artifacts.
        expr: |
          sum(rate(bookrec_recommendations_total{source="popular_fallback"}[30m]))
            / clamp_min(sum(rate(bookrec_recommendations_total[30m])), 1e-9) > 0.8
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "More than 80% of recommendation requests are served from the popularity fallback"

      - alert: BookRecArtifactsStale
        expr: time() - max(bookrec_model_created_timestamp_seconds) > 30 * 24 * 3600
        for: 1h
        labels: { severity: info }
        annotations:
          summary: "Serving artifacts are older than 30 days - consider re-exporting the model"
