# NOT part of kustomization. Create the real secret out of band:
#   kubectl -n book-recommender create secret generic book-recommender-secrets \
#     --from-literal=BOOKREC_API_KEY="$(openssl rand -hex 24)"
apiVersion: v1
kind: Secret
metadata:
  name: book-recommender-secrets
type: Opaque
stringData:
  BOOKREC_API_KEY: change-me
