apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: book-recommender
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - ingress.yaml
images:
  - name: book-recommender
    newName: ghcr.io/OWNER/REPO      # TODO: your GHCR path, lowercase
    newTag: latest
