name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: flake8 .
      # formatting is enforced for the new serving code only
      - run: black --check -l 120 src/api tests/test_api.py scripts
      - run: isort --check --profile black -l 120 src/api tests/test_api.py scripts

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=src/api --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage.xml }

  config-check:
    name: validate k8s + prometheus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kubeconform
        run: |
          kubectl kustomize k8s | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -
      - name: promtool
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/prometheus:/cfg:ro" \
            prom/prometheus:v2.55.1 check rules /cfg/alerts.yml
      - name: docker compose config
        run: docker compose config -q

  docker:
    needs: [lint, test, config-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image (local, for smoke test and scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: book-recommender:ci
          build-args: |
            VERSION=${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 book-recommender:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health/ready && break || sleep 1; done
          curl -sf "localhost:8000/v1/popular?n=3" | head -c 300; echo
          curl -sf localhost:8000/metrics | grep -q bookrec_http_requests_total
          docker logs api | tail -5
          docker rm -f api

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: book-recommender:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
